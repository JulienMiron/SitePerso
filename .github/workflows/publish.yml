name: Rendre et publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"   # minuit, heure de Québec (05:00 UTC en hiver, 01:00 en été)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nécessaire pour dater les fichiers (scripts/maj_liens_partagedms.py)

      - name: Mettre à jour les liens de PartageDMS
        run: python3 scripts/maj_liens_partagedms.py

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Rendre le site (quarto render)
        run: quarto render

      - name: Publier les changements dans docs/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rendu automatique du site (CI)"
          file_pattern: docs/** apps/PartageDMS/index.html
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
